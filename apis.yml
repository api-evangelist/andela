aid: andela
name: Andela
description: 'Andela is a global talent platform and AI services provider founded in 2014 by Jeremy
  Johnson, connecting enterprises with vetted, remote technologists and AI engineers across 135+
  countries. It grew into a unicorn (valued at $1.5B in 2021) serving 650+ clients, with a network
  of 200,000+ trained technologists. Its services span hiring AI engineers for application building,
  systems integration, and platform engineering; building enterprise AI solutions from data readiness
  to production deployment; and upskilling teams through AI curricula developed with partners such as
  NVIDIA and Google. Andela operates a fully remote model and is backed by GV, SoftBank Vision Fund,
  and Susa Ventures. It publishes no public developer API.'
